[package]
name = "agentic-armor"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "One binary. Zero runtime services. Hardened AI agent sandboxes via MCP — Docker + Podman."
repository = "https://github.com/calebrosario/agentic-armor-rust"
homepage = "https://github.com/calebrosario/agentic-armor-rust"
readme = "README.md"
keywords = ["mcp", "docker", "podman", "sandbox", "ai-agents"]
categories = ["api-bindings", "network-programming", "asynchronous"]
exclude = [".github/", ".gitignore", "data/", "AGENTS.md", "target/"]

[dependencies]
mcp-rust-sdk = { git = "https://github.com/calebrosario/rust-mcp-sdk.git", rev = "0bcbb4a47571029b48a07e121df7c6366872c15c", features = ["stdio"] }
bollard = "0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
futures-util = "0.3"
async-trait = "0.1"
libc = "0.2"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio-test = "0.4"
