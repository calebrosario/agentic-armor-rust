[package]
name = "agentic-armor"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[dependencies]
mcp-sdk = { path = "../rust-mcp-sdk", features = ["stdio"] }
bollard = "0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
futures-util = "0.3"
async-trait = "0.1"
libc = "0.2"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
