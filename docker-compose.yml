# Build context must be the parent directory containing both repos:
#   docker build -f agentic-armor-rust/Dockerfile -t agentic-armor-rust .
#
# Or use docker compose:
#   docker compose -f agentic-armor-rust/docker-compose.yml up --build

services:
  agentic-armor:
    build:
      context: ..
      dockerfile: agentic-armor-rust/Dockerfile
    container_name: agentic-armor-mcp
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://opencode:opencode@127.0.0.1:5433/agentic_armor
      - CONTAINER_RUNTIME=auto
      - RUST_LOG=agentic_armor=info,mcp_sdk=info
    stdin_open: true
    tty: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: opencode
      POSTGRES_DB: agentic_armor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
